# mundi.bill.computer: the built app as static files, plus one small Worker for claims (worker/).
# Generation, meshing and clouds all run in the browser (a Web Worker); the server only stores
# who claimed which world.
name = "mundi"
main = "worker/index.ts"
compatibility_date = "2026-10-31"
# Pinned because the API token has no account-level enumerate. Not a credential.
account_id = "af045bb950d46af2b6aee70965d97f0a"

# Cloudflare serves dist/ directly; only /api/* runs the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Claims, their log, thumbnails and rate-limit hits: one SQLite Durable Object.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

[vars]
# Turnstile site key (public), widget "mundi claims" for mundi.bill.computer;
# the matching TURNSTILE_SECRET is a secret (wrangler secret put), never in this file.
TURNSTILE_SITEKEY = "0x4AAAAAAFxdg3U7EW-teqd4"

# custom_domain provisions the DNS record and TLS cert on deploy.
[[routes]]
pattern = "mundi.bill.computer"
custom_domain = true
