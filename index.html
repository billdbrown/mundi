<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mundi</title>
  <meta name="description" content="Procedural Earth-like planet generator." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23123c66%22/%3E%3Cpath d=%22M9 12c4-3 8 0 11-2s3 5-1 7-9 1-10 5-3-7 0-10z%22 fill=%22%236f8a45%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="view"></div>

  <aside id="panel">
    <header>
      <h1>Mundi</h1>
      <button id="collapse" title="Hide panel">–</button>
    </header>
    <div id="controls">
      <label class="row">Seed
        <span class="seed"><input id="seed" type="text" spellcheck="false" autocomplete="off" title="A name (letters) or a number" /><button id="dice" title="New seed">⚄</button></span>
      </label>
      <label class="row">Cells <output id="detail-out"></output>
        <input id="detail" type="range" min="8" max="80" step="1" /></label>
      <label class="row">Ocean <output id="ocean-out"></output>
        <input id="ocean" type="range" min="0.1" max="0.9" step="0.01" /></label>
      <label class="row">Plates <output id="plates-out"></output>
        <input id="plates" type="range" min="2" max="40" step="1" /></label>
      <label class="row">Continents <output id="continents-out"></output>
        <input id="continents" type="range" min="1" max="8" step="1" /></label>
      <label class="row">Coast roughness <output id="roughness-out"></output>
        <input id="roughness" type="range" min="0" max="1" step="0.01" /></label>
      <label class="row">Heat <output id="heat-out"></output>
        <input id="heat" type="range" min="-0.35" max="0.35" step="0.01" /></label>
      <label class="row">Wetness <output id="wetness-out"></output>
        <input id="wetness" type="range" min="-0.35" max="0.35" step="0.01" /></label>
      <label class="row">Rivers <output id="rivers-out"></output>
        <input id="rivers" type="range" min="0" max="3" step="0.05" /></label>
      <label class="row">Planet radius <output id="radius-out"></output>
        <input id="radius" type="range" min="200" max="15000" step="20" /></label>
      <label class="row">Relief <output id="relief-out"></output>
        <input id="relief" type="range" min="0" max="3" step="0.05" /></label>

      <fieldset>
        <legend>View</legend>
        <select id="style">
          <option value="smooth">Realistic terrain</option>
          <option value="tiles">Hex tiles</option>
        </select>
        <select id="look">
          <option value="map">Map look</option>
          <option value="photo">Photo look</option>
        </select>
        <select id="light">
          <option value="follow">Always lit</option>
          <option value="cycle">Day &amp; night</option>
        </select>
        <select id="mode">
          <option value="biome">Biomes</option>
          <option value="elevation">Elevation</option>
          <option value="temperature">Temperature</option>
          <option value="moisture">Moisture</option>
          <option value="plates">Tectonic plates</option>
        </select>
        <label><input id="grid" type="checkbox" checked /> Grid</label>
        <label><input id="show-rivers" type="checkbox" checked /> Rivers</label>
        <label><input id="trees" type="checkbox" checked /> Trees</label>
        <label><input id="clouds" type="checkbox" checked /> Clouds</label>
        <label><input id="blend" type="checkbox" checked /> Soft borders</label>
        <label><input id="sites" type="checkbox" /> Settlement sites</label>
      </fieldset>
      <button id="export" title="Download every cell's data, continents and sites as JSON">Export JSON</button>
      <p id="stats"></p>
    </div>
  </aside>

  <div id="info" hidden></div>
  <div id="scale" title="Distance at the centre of the view, if the planet has the radius set in the panel">
    <div id="scale-bar"></div><span id="scale-label"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
