<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>worldgen</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="view"></div>

  <aside id="panel">
    <header>
      <h1>worldgen</h1>
      <button id="collapse" title="Hide panel">–</button>
    </header>
    <div id="controls">
      <label class="row">Seed
        <span class="seed"><input id="seed" type="number" min="0" step="1" /><button id="dice" title="New seed">⚄</button></span>
      </label>
      <label class="row">Cells <output id="detail-out"></output>
        <input id="detail" type="range" min="8" max="80" step="1" /></label>
      <label class="row">Ocean <output id="ocean-out"></output>
        <input id="ocean" type="range" min="0.1" max="0.9" step="0.01" /></label>
      <label class="row">Plates <output id="plates-out"></output>
        <input id="plates" type="range" min="2" max="40" step="1" /></label>
      <label class="row">Heat <output id="heat-out"></output>
        <input id="heat" type="range" min="-0.35" max="0.35" step="0.01" /></label>
      <label class="row">Wetness <output id="wetness-out"></output>
        <input id="wetness" type="range" min="-0.35" max="0.35" step="0.01" /></label>
      <label class="row">Rivers <output id="rivers-out"></output>
        <input id="rivers" type="range" min="0" max="3" step="0.05" /></label>
      <label class="row">Relief <output id="relief-out"></output>
        <input id="relief" type="range" min="0" max="3" step="0.05" /></label>

      <fieldset>
        <legend>View</legend>
        <select id="mode">
          <option value="biome">Biomes</option>
          <option value="elevation">Elevation</option>
          <option value="temperature">Temperature</option>
          <option value="moisture">Moisture</option>
          <option value="plates">Tectonic plates</option>
        </select>
        <label><input id="grid" type="checkbox" checked /> Grid</label>
        <label><input id="show-rivers" type="checkbox" checked /> Rivers</label>
        <label><input id="blend" type="checkbox" checked /> Soft borders</label>
      </fieldset>
      <p id="stats"></p>
    </div>
  </aside>

  <div id="info" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
