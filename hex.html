<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mundi · hex</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23123c66%22/%3E%3Cpath d=%22M9 12c4-3 8 0 11-2s3 5-1 7-9 1-10 5-3-7 0-10z%22 fill=%22%236f8a45%22/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c3d6; font: 13px/1.45 system-ui, sans-serif; color: #e9edf0; }
    #view { position: fixed; inset: 0; }
    .card { position: fixed; background: rgba(18, 24, 30, 0.82); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
    #panel { top: 12px; left: 12px; width: 300px; }
    #panel h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    #panel h1 a { color: #9cc3e6; font-weight: 400; font-size: 12px; margin-left: 8px; text-decoration: none; }
    #facts { color: #b9c4cc; margin-bottom: 10px; }
    #facts b { color: #fff; font-weight: 600; }
    #tuning summary { cursor: pointer; color: #b9c4cc; margin-bottom: 4px; }
    label.row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 6px; margin: 3px 0; color: #b9c4cc; }
    label.row output { text-align: right; color: #fff; }
    select, input[type=range] { width: 100%; }
    .buttons { display: flex; gap: 6px; margin-top: 10px; }
    .buttons button { flex: 1; background: #35607f; color: #fff; border: 0; border-radius: 7px; padding: 7px; cursor: pointer; font: inherit; }
    #inset { right: 12px; bottom: 12px; padding: 8px; }
    #inset canvas { display: block; width: 240px; height: 240px; border-radius: 6px; }
    #inset div { color: #93a2ad; font-size: 11px; margin-top: 4px; text-align: center; }
    #busy { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15px; }
    #hint { left: 50%; bottom: 12px; transform: translateX(-50%); color: #c9d3da; font-size: 12px; padding: 6px 12px; }
    .capture .card { display: none; }
    #timing { color: #7d8b95; font-size: 11px; margin-top: 8px; }
    #timerow { margin-top: 4px; display: grid; grid-template-columns: 34px 1fr 46px; gap: 8px; align-items: center; }
    #timerow output { text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
    #play { background: #35607f; color: #fff; border: 0; border-radius: 7px; padding: 5px 0; cursor: pointer; font: inherit; }
    #timeinfo { color: #93a2ad; font-size: 11px; margin: 2px 0 10px; }
    #timeinfo a { color: #9cc3e6; text-decoration: none; }
    #more { display: none; float: right; background: #2a3540; color: #dfe6eb; border: 1px solid #3c4955; border-radius: 7px; font: inherit; font-size: 12px; padding: 2px 8px; }
    /* Phones: a slim panel with just the time; "More" opens the rest. No inset map or key hints. */
    @media (max-width: 700px) {
      #panel { left: 8px; right: 8px; top: 8px; width: auto; padding: 8px 10px; max-height: 60vh; overflow-y: auto; }
      #panel h1 { font-size: 14px; }
      #more { display: inline-block; }
      #panel:not(.open) > :not(h1):not(#timerow) { display: none; }
      #inset, #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel" class="card">
    <h1><button id="more" type="button">More</button><span id="title">Hex</span><a id="back" href="/">← planet</a><a href="/hexes.html">gallery</a></h1>
    <div id="facts"></div>
    <div id="timerow"><button id="play" type="button" title="Play the day (P)">▶</button><input id="time" type="range" min="0" max="23.99" step="0.05" /><output id="time-out"></output></div>
    <div id="timeinfo"><span id="time-sun"></span> · <a href="#" id="time-reset" onclick="return false">style's own hour</a></div>
    <label class="row">Tilt-shift <input id="tilt" type="checkbox" style="justify-self:start" /><span></span></label>
    <label class="row">Neighbours <input id="around" type="checkbox" style="justify-self:start" /><span></span></label>
    <details id="tuning"><summary>Tuning</summary>
    <label class="row">Smaller by <input id="mag" type="range" min="4" max="40" step="1" /><output id="mag-out"></output></label>
    <label class="row">Heights ÷ <input id="vscale" type="range" min="1" max="40" step="0.5" /><output id="vscale-out"></output></label>
    <label class="row">Big heights <select id="vsoft"><option value="0">Same as small</option><option value="300">Squeezed hard</option><option value="450">Squeezed</option><option value="600">Squeezed gently</option><option value="1000">Squeezed lightly</option></select><span></span></label>
    <label class="row">Rivers <select id="river"><option value="scaled">Shrunk with the map</option><option value="flow">Life-size, from flow</option></select><span></span></label>
    <label class="row">Crags <input id="crags" type="checkbox" style="justify-self:start" /><span></span></label>
    </details>
    <label class="row">Plants <select id="plants"><option value="mundi">Mundi's own</option><option value="pack">Ultimate Nature</option><option value="packnear">Ultimate Nature, full up close</option><option value="tex">Textured trees up close</option></select><span></span></label>
    <label class="row">Detail <select id="res"><option value="257">Low</option><option value="513">Medium</option><option value="769">High</option></select><span></span></label>
    <div class="buttons"><button id="walk">Walk (W A S D)</button><button id="reset">Reset view</button></div>
    <div id="timing"></div><div id="fps" style="color:#7d8b95;font-size:11px"></div>
  </div>
  <div id="inset" class="card"><canvas id="map" width="480" height="480"></canvas><div>The planet's view of this ground · white = this hex</div></div>
  <div id="busy" class="card">Building the hex…</div>
  <div id="hint" class="card">Drag to orbit · [ ] hour · P play the day · N neighbours · T tilt-shift · right-drag to pan · scroll to zoom · H hex outline · the red figure is 1.8 m</div>
  <script>document.getElementById('more').onclick = () => document.getElementById('panel').classList.toggle('open');</script>
  <script type="module" src="/src/hex.ts"></script>
</body>
</html>
